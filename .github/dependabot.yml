version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep type definitions aligned with the minimum supported Node runtime.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
